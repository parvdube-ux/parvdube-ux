<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="480">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#19062b" />
      <stop offset="60%" stop-color="#0c0316" />
      <stop offset="100%" stop-color="#05010a" />
    </radialGradient>

    <!-- Center Hub Gradient -->
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="85%" stop-color="#120320" />
      <stop offset="100%" stop-color="#07010d" />
    </radialGradient>

    <!-- Active Glowing Gradient -->
    <linearGradient id="activeWedgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#ff00bb" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .hud-title {
        font-family: 'Impact', 'Arial Black', sans-serif;
        text-transform: uppercase;
        letter-spacing: 3px;
      }
      .hud-mono {
        font-family: 'Consolas', 'Courier New', monospace;
      }
      .wedge-idle {
        fill: #130623;
        stroke: #391157;
        stroke-width: 1.5;
        transition: all 0.3s ease;
      }

      /* 16s Animation Timeline: 8 items x 2s each */
      @keyframes cycleSlots {
        0%, 12% { transform: rotate(0deg); }
        12.5%, 24.5% { transform: rotate(45deg); }
        25%, 37% { transform: rotate(90deg); }
        37.5%, 49.5% { transform: rotate(135deg); }
        50%, 62% { transform: rotate(180deg); }
        62.5%, 74.5% { transform: rotate(225deg); }
        75%, 87% { transform: rotate(270deg); }
        87.5%, 99.5% { transform: rotate(315deg); }
        100% { transform: rotate(360deg); }
      }

      /* Center Display Opacity Animations */
      @keyframes showCard0 { 0%, 12% { opacity: 1; } 12.5%, 100% { opacity: 0; } }
      @keyframes showCard1 { 0%, 12% { opacity: 0; } 12.5%, 24.5% { opacity: 1; } 25%, 100% { opacity: 0; } }
      @keyframes showCard2 { 0%, 24.5% { opacity: 0; } 25%, 37% { opacity: 1; } 37.5%, 100% { opacity: 0; } }
      @keyframes showCard3 { 0%, 37% { opacity: 0; } 37.5%, 49.5% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes showCard4 { 0%, 49.5% { opacity: 0; } 50%, 62% { opacity: 1; } 62.5%, 100% { opacity: 0; } }
      @keyframes showCard5 { 0%, 62% { opacity: 0; } 62.5%, 74.5% { opacity: 1; } 75%, 100% { opacity: 0; } }
      @keyframes showCard6 { 0%, 74.5% { opacity: 0; } 75%, 87% { opacity: 1; } 87.5%, 100% { opacity: 0; } }
      @keyframes showCard7 { 0%, 87% { opacity: 0; } 87.5%, 99.5% { opacity: 1; } 100% { opacity: 0; } }

      .selector-pointer {
        transform-origin: 400px 240px;
        animation: cycleSlots 16s cubic-bezier(0.68, -0.2, 0.265, 1.2) infinite;
      }
      .card-0 { animation: showCard0 16s infinite; }
      .card-1 { animation: showCard1 16s infinite; }
      .card-2 { animation: showCard2 16s infinite; }
      .card-3 { animation: showCard3 16s infinite; }
      .card-4 { animation: showCard4 16s infinite; }
      .card-5 { animation: showCard5 16s infinite; }
      .card-6 { animation: showCard6 16s infinite; }
      .card-7 { animation: showCard7 16s infinite; }

      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .radar {
        transform-origin: 400px 240px;
        animation: radarSweep 6s linear infinite;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="480" rx="14" fill="url(#bgGrad)" stroke="#ff007f" stroke-width="2" />
  
  <!-- Subtle Grid Scanlines -->
  <g stroke="#ff007f" stroke-width="0.5" opacity="0.12">
    <line x1="0" y1="0" x2="800" y2="0" />
    <line x1="0" y1="24" x2="800" y2="24" />
    <line x1="0" y1="48" x2="800" y2="48" />
    <line x1="0" y1="72" x2="800" y2="72" />
    <line x1="0" y1="96" x2="800" y2="96" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="144" x2="800" y2="144" />
    <line x1="0" y1="168" x2="800" y2="168" />
    <line x1="0" y1="192" x2="800" y2="192" />
    <line x1="0" y1="216" x2="800" y2="216" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="264" x2="800" y2="264" />
    <line x1="0" y1="288" x2="800" y2="288" />
    <line x1="0" y1="312" x2="800" y2="312" />
    <line x1="0" y1="336" x2="800" y2="336" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="384" x2="800" y2="384" />
    <line x1="0" y1="408" x2="800" y2="408" />
    <line x1="0" y1="432" x2="800" y2="432" />
    <line x1="0" y1="456" x2="800" y2="456" />
  </g>

  <!-- Top Title HUD -->
  <g text-anchor="middle">
    <rect x="230" y="14" width="340" height="26" rx="5" fill="#0c0217" stroke="#00f0ff" stroke-width="1.2" />
    <text x="400" y="32" fill="#00f0ff" font-size="12" font-weight="900" class="hud-title" letter-spacing="4">
      [TAB] GTA WEAPON WHEEL // ARSENAL SELECT
    </text>
  </g>

  <!-- Background Decorative Rings -->
  <circle cx="400" cy="240" r="202" fill="none" stroke="#2b0a42" stroke-width="1.5" stroke-dasharray="6,4" />
  <circle cx="400" cy="240" r="85" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.3" />

  <!-- Idle Wedges -->
  <g id="wedges">
    <path d="M 366.0 151.3 L 331.9 62.6 A 190 190 0 0 1 468.1 62.6 L 434.0 151.3 A 95 95 0 0 0 366.0 151.3 Z" class="wedge-idle" />
    <path d="M 438.6 153.2 L 477.3 66.4 A 190 190 0 0 1 573.6 162.7 L 486.8 201.4 A 95 95 0 0 0 438.6 153.2 Z" class="wedge-idle" />
    <path d="M 488.7 206.0 L 577.4 171.9 A 190 190 0 0 1 577.4 308.1 L 488.7 274.0 A 95 95 0 0 0 488.7 206.0 Z" class="wedge-idle" />
    <path d="M 486.8 278.6 L 573.6 317.3 A 190 190 0 0 1 477.3 413.6 L 438.6 326.8 A 95 95 0 0 0 486.8 278.6 Z" class="wedge-idle" />
    <path d="M 434.0 328.7 L 468.1 417.4 A 190 190 0 0 1 331.9 417.4 L 366.0 328.7 A 95 95 0 0 0 434.0 328.7 Z" class="wedge-idle" />
    <path d="M 361.4 326.8 L 322.7 413.6 A 190 190 0 0 1 226.4 317.3 L 313.2 278.6 A 95 95 0 0 0 361.4 326.8 Z" class="wedge-idle" />
    <path d="M 311.3 274.0 L 222.6 308.1 A 190 190 0 0 1 222.6 171.9 L 311.3 206.0 A 95 95 0 0 0 311.3 274.0 Z" class="wedge-idle" />
    <path d="M 313.2 201.4 L 226.4 162.7 A 190 190 0 0 1 322.7 66.4 L 361.4 153.2 A 95 95 0 0 0 313.2 201.4 Z" class="wedge-idle" />
  </g>

  <!-- Dynamic Active Wedge Selector (Rotates smoothly around the center) -->
  <g class="selector-pointer">
    <!-- Active wedge pointing at top (-90deg), rotated by keyframes -->
    <path d="M 366.0 151.3 L 331.9 62.6 A 190 190 0 0 1 468.1 62.6 L 434.0 151.3 A 95 95 0 0 0 366.0 151.3 Z" fill="url(#activeWedgeGrad)" stroke="#00f0ff" stroke-width="3" filter="url(#intenseGlow)" opacity="0.95" />
    <!-- Yellow Sight / Reticle Pip -->
    <circle cx="400" cy="44" r="4.5" fill="#ffd700" filter="url(#neonBlur)" />
  </g>

  <!-- Radar line sweep for extra GTA/military HUD effect -->
  <g class="radar" opacity="0.25">
    <line x1="400" y1="240" x2="400" y2="50" stroke="#00f0ff" stroke-width="2" />
  </g>

  <!-- Wedge Icons & Labels -->
  <g text-anchor="middle">
    <text x="400.0" y="93.5" font-size="16">🤖</text>
    <text x="400.0" y="110.5" fill="#ffffff" font-size="9" font-weight="900" class="hud-title">AI & AGENTS</text>
  </g>
  <g text-anchor="middle">
    <text x="500.8" y="135.2" font-size="16">🗡️</text>
    <text x="500.8" y="152.2" fill="#ffffff" font-size="9" font-weight="900" class="hud-title">LANGUAGES</text>
  </g>
  <g text-anchor="middle">
    <text x="542.5" y="236.0" font-size="16">🔫</text>
    <text x="542.5" y="253.0" fill="#ffffff" font-size="9" font-weight="900" class="hud-title">FRONTEND</text>
  </g>
  <g text-anchor="middle">
    <text x="500.8" y="336.8" font-size="16">💣</text>
    <text x="500.8" y="353.8" fill="#ffffff" font-size="9" font-weight="900" class="hud-title">BACKEND</text>
  </g>
  <g text-anchor="middle">
    <text x="400.0" y="378.5" font-size="16">🏦</text>
    <text x="400.0" y="395.5" fill="#ffffff" font-size="9" font-weight="900" class="hud-title">DATABASES</text>
  </g>
  <g text-anchor="middle">
    <text x="299.2" y="336.8" font-size="16">🕶️</text>
    <text x="299.2" y="353.8" fill="#ffffff" font-size="9" font-weight="900" class="hud-title">DEV TOOLS</text>
  </g>
  <g text-anchor="middle">
    <text x="257.5" y="236.0" font-size="16">☁️</text>
    <text x="257.5" y="253.0" fill="#ffffff" font-size="9" font-weight="900" class="hud-title">DEVOPS</text>
  </g>
  <g text-anchor="middle">
    <text x="299.2" y="135.2" font-size="16">🧠</text>
    <text x="299.2" y="152.2" fill="#ffffff" font-size="9" font-weight="900" class="hud-title">CORE CS</text>
  </g>

  <!-- Center Circular Hub -->
  <circle cx="400" cy="240" r="83" fill="url(#centerGrad)" stroke="#ff007f" stroke-width="2.5" />
  <circle cx="400" cy="240" r="79" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.5" stroke-dasharray="4,3" />

  <!-- Center Weapon Cards (Animated by CSS Opacity) -->
  <g class="card-0" text-anchor="middle">
    <text x="400" y="202" font-size="24">🤖</text>
    <text x="400" y="225" fill="#00f0ff" font-size="11" font-weight="900" class="hud-title" filter="url(#neonBlur)">AI & AGENTIC</text>
    <text x="400" y="242" fill="#ffffff" font-size="8.5" font-weight="bold" class="hud-mono">Google Gemini & LLMs</text>
    <rect x="345" y="256" width="110" height="7" rx="3.5" fill="#130623" stroke="#ff007f" stroke-width="0.8" />
    <rect x="346" y="257" width="95" height="5" rx="2.5" fill="#00f0ff" />
    <text x="400" y="278" fill="#ffd700" font-size="7.5" font-weight="900" class="hud-title">EFFICIENCY: 99% // BOUNDED / AUDITED</text>
  </g>
  <g class="card-1" text-anchor="middle">
    <text x="400" y="202" font-size="24">🗡️</text>
    <text x="400" y="225" fill="#00f0ff" font-size="11" font-weight="900" class="hud-title" filter="url(#neonBlur)">CORE LANGUAGES</text>
    <text x="400" y="242" fill="#ffffff" font-size="8.5" font-weight="bold" class="hud-mono">Python • JS • C++ • Java</text>
    <rect x="345" y="256" width="110" height="7" rx="3.5" fill="#130623" stroke="#ff007f" stroke-width="0.8" />
    <rect x="346" y="257" width="95" height="5" rx="2.5" fill="#00f0ff" />
    <text x="400" y="278" fill="#ffd700" font-size="7.5" font-weight="900" class="hud-title">EFFICIENCY: 98% // MULTI-PARADIGM</text>
  </g>
  <g class="card-2" text-anchor="middle">
    <text x="400" y="202" font-size="24">🔫</text>
    <text x="400" y="225" fill="#00f0ff" font-size="11" font-weight="900" class="hud-title" filter="url(#neonBlur)">FRONTEND ARSENAL</text>
    <text x="400" y="242" fill="#ffffff" font-size="8.5" font-weight="bold" class="hud-mono">React • Next.js • Tailwind</text>
    <rect x="345" y="256" width="110" height="7" rx="3.5" fill="#130623" stroke="#ff007f" stroke-width="0.8" />
    <rect x="346" y="257" width="95" height="5" rx="2.5" fill="#00f0ff" />
    <text x="400" y="278" fill="#ffd700" font-size="7.5" font-weight="900" class="hud-title">EFFICIENCY: 95% // RESPONSIVE / SCSS</text>
  </g>
  <g class="card-3" text-anchor="middle">
    <text x="400" y="202" font-size="24">💣</text>
    <text x="400" y="225" fill="#00f0ff" font-size="11" font-weight="900" class="hud-title" filter="url(#neonBlur)">BACKEND HEAVY</text>
    <text x="400" y="242" fill="#ffffff" font-size="8.5" font-weight="bold" class="hud-mono">Node.js • Express • REST</text>
    <rect x="345" y="256" width="110" height="7" rx="3.5" fill="#130623" stroke="#ff007f" stroke-width="0.8" />
    <rect x="346" y="257" width="95" height="5" rx="2.5" fill="#00f0ff" />
    <text x="400" y="278" fill="#ffd700" font-size="7.5" font-weight="900" class="hud-title">EFFICIENCY: 99% // ENTERPRISE RBAC</text>
  </g>
  <g class="card-4" text-anchor="middle">
    <text x="400" y="202" font-size="24">🏦</text>
    <text x="400" y="225" fill="#00f0ff" font-size="11" font-weight="900" class="hud-title" filter="url(#neonBlur)">SAFE CRACKERS</text>
    <text x="400" y="242" fill="#ffffff" font-size="8.5" font-weight="bold" class="hud-mono">MongoDB • Aggregations</text>
    <rect x="345" y="256" width="110" height="7" rx="3.5" fill="#130623" stroke="#ff007f" stroke-width="0.8" />
    <rect x="346" y="257" width="95" height="5" rx="2.5" fill="#00f0ff" />
    <text x="400" y="278" fill="#ffd700" font-size="7.5" font-weight="900" class="hud-title">EFFICIENCY: 96% // PIPELINE LOGIC</text>
  </g>
  <g class="card-5" text-anchor="middle">
    <text x="400" y="202" font-size="24">🕶️</text>
    <text x="400" y="225" fill="#00f0ff" font-size="11" font-weight="900" class="hud-title" filter="url(#neonBlur)">DEV GEAR</text>
    <text x="400" y="242" fill="#ffffff" font-size="8.5" font-weight="bold" class="hud-mono">Git • Postman • Claude</text>
    <rect x="345" y="256" width="110" height="7" rx="3.5" fill="#130623" stroke="#ff007f" stroke-width="0.8" />
    <rect x="346" y="257" width="95" height="5" rx="2.5" fill="#00f0ff" />
    <text x="400" y="278" fill="#ffd700" font-size="7.5" font-weight="900" class="hud-title">EFFICIENCY: 95% // RAPID DISPATCH</text>
  </g>
  <g class="card-6" text-anchor="middle">
    <text x="400" y="202" font-size="24">☁️</text>
    <text x="400" y="225" fill="#00f0ff" font-size="11" font-weight="900" class="hud-title" filter="url(#neonBlur)">DEVOPS & CLOUD</text>
    <text x="400" y="242" fill="#ffffff" font-size="8.5" font-weight="bold" class="hud-mono">CI/CD • Kubernetes • Docker</text>
    <rect x="345" y="256" width="110" height="7" rx="3.5" fill="#130623" stroke="#ff007f" stroke-width="0.8" />
    <rect x="346" y="257" width="95" height="5" rx="2.5" fill="#00f0ff" />
    <text x="400" y="278" fill="#ffd700" font-size="7.5" font-weight="900" class="hud-title">EFFICIENCY: 90% // CONTAINER OPS</text>
  </g>
  <g class="card-7" text-anchor="middle">
    <text x="400" y="202" font-size="24">🧠</text>
    <text x="400" y="225" fill="#00f0ff" font-size="11" font-weight="900" class="hud-title" filter="url(#neonBlur)">CORE FOUNDATIONS</text>
